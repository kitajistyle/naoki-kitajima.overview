<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日の栄養</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23F1B}a:hover{color:#8E3014}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #2B2622; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1 1 auto; overflow-y: auto; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #6E655D">10月21日（水）· 自分だけに表示</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 700">今日の栄養</h1>
      </div>
      <span style="font-size: 11px; padding: 4px 10px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E5DACE; color: #6E655D">健康管理スタイル</span>
    </div>

    <section style="background: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; align-items: center; gap: 18px">
      <svg width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="目標カロリーに対する摂取量">
        <circle cx="66" cy="66" r="54" fill="none" stroke="#F1E9E0" stroke-width="14"></circle>
        <circle cx="66" cy="66" r="54" fill="none" stroke="#B23F1B" stroke-width="14" stroke-linecap="round" stroke-dasharray="220 340" transform="rotate(-90 66 66)"></circle>
        <text x="66" y="64" text-anchor="middle" font-size="22" font-weight="700" fill="#2B2622" font-family="Zen Maru Gothic, sans-serif">[摂取]</text>
        <text x="66" y="84" text-anchor="middle" font-size="12" fill="#6E655D" font-family="Zen Maru Gothic, sans-serif">/ [目標] kcal</text>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-width: 0">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 12px"><span>たんぱく質 P</span><span style="color: #6E655D">[g]</span></div>
          <div style="height: 8px; border-radius: 4px; background: #F1E9E0"><div style="width: 48%; height: 8px; border-radius: 4px; background: #2F6FA8"></div></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 12px"><span>脂質 F</span><span style="color: #6E655D">[g]</span></div>
          <div style="height: 8px; border-radius: 4px; background: #F1E9E0"><div style="width: 72%; height: 8px; border-radius: 4px; background: #D9A23A"></div></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 12px"><span>炭水化物 C</span><span style="color: #6E655D">[g]</span></div>
          <div style="height: 8px; border-radius: 4px; background: #F1E9E0"><div style="width: 64%; height: 8px; border-radius: 4px; background: #2F7A4F"></div></div>
        </div>
      </div>
    </section>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">足りていないもの</h2>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 92px; font-size: 13px">[栄養素 1]</span>
          <div style="flex: 1 1 auto; height: 10px; border-radius: 5px; background: #F1E9E0"><div style="width: 35%; height: 10px; border-radius: 5px; background: #8A8077"></div></div>
          <span style="font-size: 12px; color: #6E655D; width: 44px; text-align: right">[%]</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 92px; font-size: 13px">[栄養素 2]</span>
          <div style="flex: 1 1 auto; height: 10px; border-radius: 5px; background: #F1E9E0"><div style="width: 52%; height: 10px; border-radius: 5px; background: #8A8077"></div></div>
          <span style="font-size: 12px; color: #6E655D; width: 44px; text-align: right">[%]</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 92px; font-size: 13px">[栄養素 3]</span>
          <div style="flex: 1 1 auto; height: 10px; border-radius: 5px; background: #F1E9E0"><div style="width: 60%; height: 10px; border-radius: 5px; background: #8A8077"></div></div>
          <span style="font-size: 12px; color: #6E655D; width: 44px; text-align: right">[%]</span>
        </div>
      </div>
    </section>

    <section style="background: #FCE6DC; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A3615" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.2 5.5L20 9l-4.5 3.8L17 19l-5-3.2L7 19l1.5-6.2L4 9l5.8-.5z"></path></svg>
        <h2 style="margin: 0; font-size: 15px; font-weight: 700; color: #9A3615">夜ごはんのおすすめ</h2>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 1.6">[不足分を補える献立の提案]</p>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button style="padding: 8px 4px 10px; border-radius: 16px; border: none; background: #FFFFFF; font-family: inherit; color: #2B2622; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <svg width="64" height="64" viewBox="0 0 120 120" aria-hidden="true"><circle cx="40" cy="56" r="14" fill="#7DBB5E"></circle><circle cx="60" cy="48" r="16" fill="#5E9E48"></circle><circle cx="80" cy="56" r="13" fill="#8CC66A"></circle><circle cx="50" cy="52" r="6" fill="#E8613C"></circle><circle cx="74" cy="47" r="5" fill="#E8613C"></circle><circle cx="64" cy="58" r="6" fill="#FFF6DA"></circle><circle cx="64" cy="58" r="3" fill="#F2A71B"></circle><path d="M20 60h80c0 22-18 36-40 36S20 82 20 60z" fill="#E3EEF5"></path></svg>
          <span style="font-size: 12px; font-weight: 500">サラダ</span>
        </button>
        <button style="padding: 8px 4px 10px; border-radius: 16px; border: none; background: #FFFFFF; font-family: inherit; color: #2B2622; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <svg width="64" height="64" viewBox="0 0 120 120" aria-hidden="true"><path d="M24 58c4-16 18-24 36-24s32 8 36 24z" fill="#F4EEE6"></path><path d="M40 47c6-8 20-10 30-6 4 2 4 6 0 8-10 4-22 4-30-2z" fill="#F08A65"></path><circle cx="78" cy="47" r="5" fill="#6BAA5C"></circle><path d="M18 58h84c0 24-18 40-42 40S18 82 18 58z" fill="#3E6E8E"></path><rect x="16" y="55" width="88" height="7" rx="3.5" fill="#2F5873"></rect></svg>
          <span style="font-size: 12px; font-weight: 500">鮭丼</span>
        </button>
        <button style="padding: 8px 4px 10px; border-radius: 16px; border: none; background: #FFFFFF; font-family: inherit; color: #2B2622; display: flex; flex-direction: column; align-items: center; gap: 4px">
          <svg width="64" height="64" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 24c9 0 42 52 42 64 0 9-8 10-42 10s-42-1-42-10c0-12 33-64 42-64z" fill="#F4EEE6"></path><rect x="44" y="70" width="32" height="28" rx="3" fill="#2E3B33"></rect><circle cx="52" cy="52" r="1.8" fill="#C9BCAE"></circle><circle cx="66" cy="48" r="1.8" fill="#C9BCAE"></circle><circle cx="60" cy="60" r="1.8" fill="#C9BCAE"></circle></svg>
          <span style="font-size: 12px; font-weight: 500">おにぎり</span>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">今日の内訳</h2>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 8px 14px 8px 8px; display: flex; gap: 10px; align-items: center; min-height: 44px">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #FBEBD3; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 120 120" aria-hidden="true"><path d="M28 46c0-14 10-22 32-22s32 8 32 22c0 4-3 6-6 7v37H34V53c-3-1-6-3-6-7z" fill="#D9A15B"></path><path d="M34 48c0-10 8-16 26-16s26 6 26 16c0 3-2 4-4 5v31H38V53c-2-1-4-2-4-5z" fill="#F3D39A"></path><path d="M42 62c1-10 14-14 23-10 10 4 13 15 6 22-7 6-21 7-27 0-2-3-3-8-2-12z" fill="#FFFFFF"></path><circle cx="58" cy="64" r="8" fill="#F2A71B"></circle></svg></span>
        <span style="font-size: 14px; flex: 1 1 auto">朝ごはん</span><span style="font-size: 13px; color: #6E655D">[kcal]</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 8px 14px 8px 8px; display: flex; gap: 10px; align-items: center; min-height: 44px">
        <span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #E3EEF5; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 120 120" aria-hidden="true"><path d="M24 58c4-16 18-24 36-24s32 8 36 24z" fill="#FFFFFF"></path><path d="M40 47c6-8 20-10 30-6 4 2 4 6 0 8-10 4-22 4-30-2z" fill="#F08A65"></path><circle cx="78" cy="47" r="5" fill="#6BAA5C"></circle><path d="M18 58h84c0 24-18 40-42 40S18 82 18 58z" fill="#3E6E8E"></path><rect x="16" y="55" width="88" height="7" rx="3.5" fill="#2F5873"></rect></svg></span>
        <span style="font-size: 14px; flex: 1 1 auto">昼ごはん</span><span style="font-size: 13px; color: #6E655D">[kcal]</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; min-height: 44px; border: 1.5px dashed #C9BCAE"><span style="font-size: 14px; color: #6E655D">夜ごはん（まだ）</span><a href="Camera.html" style="font-size: 13px; font-weight: 700">撮る</a></div>
    </section>
  </div>
</div>
</body>
</html>
