<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投稿を通報</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23F1B}a:hover{color:#8E3014}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #2B2622; font-family: 'Zen Maru Gothic', sans-serif; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 56px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #FFFFFF; border-radius: 20px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px">
        <div style="width: 36px; height: 36px; border-radius: 18px; background: #DCE6F2"></div>
        <span style="font-size: 14px; font-weight: 700">[ユーザー名]</span>
        <span style="margin-left: auto; font-size: 20px; color: #6E655D; letter-spacing: 2px">…</span>
      </div>
      <div style="height: 260px; background: #F6DDD2; display: flex; align-items: center; justify-content: center">
        <svg width="190" height="190" viewBox="0 0 120 120"><path d="M16 54h88c0 26-20 42-44 42S16 80 16 54z" fill="#D64545"></path><ellipse cx="60" cy="54" rx="44" ry="11" fill="#E9B872"></ellipse><circle cx="42" cy="52" r="9" fill="#C98A5A"></circle><ellipse cx="64" cy="51" rx="8" ry="6" fill="#FFFFFF"></ellipse><circle cx="64" cy="51" r="3.5" fill="#F2A71B"></circle></svg>
      </div>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(30,26,23,0.5)"></div>

  <div role="dialog" aria-labelledby="rtitle" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FBF7F2; border-radius: 28px 28px 0 0; padding: 10px 16px 34px; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #D9CFC4; align-self: center"></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 id="rtitle" style="margin: 0; font-size: 19px; font-weight: 700">この投稿を通報する</h1>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.6; color: #6E655D">通報したことは相手に通知されません。内容は運営が確認します。</p>
    </div>
    <fieldset style="margin: 0; padding: 4px 14px; border: none; background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column">
      <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden">通報の理由</legend>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px"><span style="font-size: 14px; flex: 1 1 auto">食事と関係ない写真</span><input type="radio" name="why" style="width: 22px; height: 22px; margin: 0; accent-color: #B23F1B"></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">不快・攻撃的な内容</span><input type="radio" name="why" checked style="width: 22px; height: 22px; margin: 0; accent-color: #B23F1B"></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">体型や食べる量をからかう</span><input type="radio" name="why" style="width: 22px; height: 22px; margin: 0; accent-color: #B23F1B"></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">スパム・宣伝</span><input type="radio" name="why" style="width: 22px; height: 22px; margin: 0; accent-color: #B23F1B"></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">なりすまし</span><input type="radio" name="why" style="width: 22px; height: 22px; margin: 0; accent-color: #B23F1B"></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 50px; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">その他</span><input type="radio" name="why" style="width: 22px; height: 22px; margin: 0; accent-color: #B23F1B"></label>
    </fieldset>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 4px">
      <input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #B23F1B">
      <span style="font-size: 14px">[ユーザー名]さんをブロックする</span>
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Main.html" style="height: 50px; box-sizing: border-box; border-radius: 25px; border: 1.5px solid #E5DACE; background: #FFFFFF; color: #2B2622; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">キャンセル</a>
      <a href="Main.html" style="height: 50px; border-radius: 25px; background: #B23F1B; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">通報する</a>
    </div>
  </div>
</div>
</body>
</html>
