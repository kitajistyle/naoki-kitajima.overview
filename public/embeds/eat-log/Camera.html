<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>撮影</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F1E3D3}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1E1A17; color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: none; padding: 56px 16px 12px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.html" aria-label="閉じる" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <span style="font-size: 17px; font-weight: 700">夜ごはん</span>
      <span style="font-size: 12px; color: #D6CCC2">16:00〜翌4:00</span>
    </div>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="flex: 1 1 auto; margin: 0 16px; border-radius: 28px; background: #3A332E; position: relative; display: flex; align-items: center; justify-content: center">
    <div style="position: absolute; inset: 0; border-radius: 28px; background: #6B4E3A; overflow: hidden">
      <div style="position: absolute; left: -40px; right: -40px; bottom: -60px; height: 320px; border-radius: 50%; background: #8A6A50"></div>
    </div>
    <svg width="300" height="300" viewBox="0 0 120 120" role="img" aria-label="カメラに映るカレーライスとサラダ" style="position: relative; margin-top: -60px"><ellipse cx="60" cy="64" rx="52" ry="32" fill="#FFFFFF"></ellipse><ellipse cx="60" cy="64" rx="44" ry="25" fill="#F4EEE6"></ellipse><path d="M20 64c0-12 12-20 28-20 10 0 16 6 16 14 0 12-12 22-28 22-10 0-16-6-16-16z" fill="#FFFFFF"></path><path d="M54 50c14-6 34-4 42 6 6 8 2 20-12 24-12 4-26 2-32-6-4-6-4-20 2-24z" fill="#C7772A"></path><rect x="66" y="56" width="11" height="9" rx="3" fill="#E8A04A"></rect><rect x="81" y="63" width="9" height="8" rx="3" fill="#F2C07A"></rect><path d="M66 71l9-2 2 6-9 2z" fill="#E8613C"></path><circle cx="34" cy="56" r="3.5" fill="#D64545"></circle><circle cx="40" cy="54" r="3" fill="#D64545"></circle><path d="M100 30l10-20" stroke="#C9BCAE" stroke-width="3" stroke-linecap="round"></path></svg>
    <div style="position: absolute; left: 50%; top: 50%; width: 260px; height: 200px; margin: -160px 0 0 -130px; border-radius: 24px; border: 2px solid rgba(255,255,255,0.7)"></div>
    <span style="position: absolute; top: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; padding: 6px 12px; border-radius: 14px; background: rgba(30,26,23,0.72); white-space: nowrap">カレーライス を見つけました</span>
    <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; background: rgba(30,26,23,0.72); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <label for="bright" style="display: flex; justify-content: space-between; font-size: 13px">
        <span>明るさ</span><span style="color: #D6CCC2">加工はここまで</span>
      </label>
      <input id="bright" type="range" min="-50" max="50" value="10" style="width: 100%; accent-color: #F08A65">
    </div>
  </div>

  <div style="flex: none; height: 200px; padding: 20px 28px 36px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <button aria-label="カメラロールから選ぶ" style="width: 52px; height: 52px; border-radius: 14px; border: 2px solid #FFFFFF; background: #5A4F47; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M20 16l-5-5-9 9"></path></svg>
      </button>
      <span style="font-size: 11px; color: #D6CCC2; text-align: center; line-height: 1.4">1時間以内の<br>写真のみ</span>
    </div>
    <a href="Post.html" aria-label="撮影する" style="justify-self: center; width: 84px; height: 84px; box-sizing: border-box; border-radius: 42px; border: 5px solid #FFFFFF; display: flex; align-items: center; justify-content: center">
      <span style="width: 64px; height: 64px; border-radius: 32px; background: #F08A65; display: block"></span>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
      <button aria-label="カメラを切り替え" style="width: 52px; height: 52px; border-radius: 26px; border: none; background: rgba(255,255,255,0.12); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"></path><path d="M20 4v5h-5M4 20v-5h5"></path></svg>
      </button>
      <span style="font-size: 11px; color: #D6CCC2">切り替え</span>
    </div>
  </div>
</div>
</body>
</html>
