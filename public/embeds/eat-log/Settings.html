<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23F1B}a:hover{color:#8E3014}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #2B2622; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1 1 auto; overflow-y: auto; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0 0 0 4px; font-size: 26px; font-weight: 700">マイページ</h1>

    <a href="ProfileEdit.html" style="background: #FFFFFF; border-radius: 22px; padding: 14px; display: flex; gap: 14px; align-items: center; text-decoration: none; color: #2B2622">
      <div style="width: 60px; height: 60px; flex: none; border-radius: 30px; background: #FBEBD3; display: flex; align-items: center; justify-content: center">
        <svg width="46" height="46" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 24c9 0 42 52 42 64 0 9-8 10-42 10s-42-1-42-10c0-12 33-64 42-64z" fill="#FFFFFF"></path><rect x="44" y="70" width="32" height="28" rx="3" fill="#2E3B33"></rect></svg>
      </div>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0"><b style="font-size: 17px">[名前]</b><span style="font-size: 13px; color: #6E655D">@[ユーザーID]</span></span>
      <span style="font-size: 13px; font-weight: 500; color: #9A3615">編集</span>
    </a>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <a href="Friends.html" style="background: #FFFFFF; border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #2B2622"><b style="font-size: 18px">[数]</b><span style="font-size: 12px; color: #6E655D">友達</span></a>
      <a href="Calendar.html" style="background: #FFFFFF; border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #2B2622"><b style="font-size: 18px">[数]</b><span style="font-size: 12px; color: #6E655D">投稿</span></a>
      <a href="Calendar.html" style="background: #FFFFFF; border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #2B2622"><b style="font-size: 18px">[数]</b><span style="font-size: 12px; color: #6E655D">3食そろった日</span></a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 0 6px; font-size: 13px; color: #5C544C; font-weight: 500">楽しみ方</h2>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 0 14px; display: flex; flex-direction: column">
        <a href="Style.html" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622"><span style="font-size: 14px; flex: 1 1 auto">スタイル</span><span style="font-size: 13px; color: #6E655D">ゆるく共有</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
        <a href="Nutrition.html" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">目標・からだの情報</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 0 6px; font-size: 13px; color: #5C544C; font-weight: 500">アカウント</h2>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 0 14px; display: flex; flex-direction: column">
        <a href="NotifySettings.html" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622"><span style="font-size: 14px; flex: 1 1 auto">通知</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
        <a href="Privacy.html" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">プライバシー</span><span style="font-size: 13px; color: #6E655D">友達だけ</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
        <a href="Friends.html" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">友達・ブロック</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
        <a href="#export" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">データのダウンロード</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 0 6px; font-size: 13px; color: #5C544C; font-weight: 500">サポート</h2>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 0 14px; display: flex; flex-direction: column">
        <a href="#help" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622"><span style="font-size: 14px; flex: 1 1 auto">ヘルプ・お問い合わせ</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
        <a href="#terms" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">利用規約</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
        <a href="#policy" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">プライバシーポリシー</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
        <a href="#licenses" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">ライセンス</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
        <div style="display: flex; gap: 12px; align-items: center; min-height: 52px; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">バージョン</span><span style="font-size: 13px; color: #6E655D">[1.0.0]</span></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 0 14px; display: flex; flex-direction: column">
      <button style="min-height: 52px; border: none; background: transparent; padding: 0; text-align: left; font-family: inherit; font-size: 14px; color: #2B2622">ログアウト</button>
      <a href="DeleteAccount.html" style="display: flex; align-items: center; min-height: 52px; text-decoration: none; color: #A3241A; font-size: 14px; border-top: 1px solid #F1EBE4">アカウントを削除</a>
    </div>
  </div>

  <nav style="flex: none; height: 84px; box-sizing: border-box; padding: 8px 12px 24px; background: #FFFFFF; border-top: 1px solid #EEE6DC; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="Main.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #6E655D; font-size: 11px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>今日</a>
    <a href="Calendar.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #6E655D; font-size: 11px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>カレンダー</a>
    <a href="Camera.html" aria-label="撮る" style="justify-self: center; width: 56px; height: 56px; border-radius: 28px; background: #B23F1B; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></a>
    <a href="Nutrition.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #6E655D; font-size: 11px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"></path></svg>栄養</a>
    <a href="Settings.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #B23F1B; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>マイページ</a>
  </nav>
</div>
</body>
</html>
