<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>料理を修正</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23F1B}a:hover{color:#8E3014}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #2B2622; font-family: 'Zen Maru Gothic', sans-serif; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 112px 16px 0">
    <div style="height: 230px; border-radius: 24px; background: #F6DDD2; display: flex; align-items: center; justify-content: center">
      <svg width="210" height="210" viewBox="0 0 120 120"><ellipse cx="60" cy="64" rx="52" ry="32" fill="#FFFFFF"></ellipse><ellipse cx="60" cy="64" rx="44" ry="25" fill="#F4EEE6"></ellipse><path d="M20 64c0-12 12-20 28-20 10 0 16 6 16 14 0 12-12 22-28 22-10 0-16-6-16-16z" fill="#FFFFFF"></path><path d="M54 50c14-6 34-4 42 6 6 8 2 20-12 24-12 4-26 2-32-6-4-6-4-20 2-24z" fill="#C7772A"></path><rect x="66" y="56" width="11" height="9" rx="3" fill="#E8A04A"></rect></svg>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(30,26,23,0.5)"></div>

  <div role="dialog" aria-labelledby="ftitle" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FBF7F2; border-radius: 28px 28px 0 0; padding: 10px 16px 34px; display: flex; flex-direction: column; gap: 16px">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #D9CFC4; align-self: center"></div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 52px; height: 52px; flex: none; border-radius: 14px; background: #F6DDD2; display: flex; align-items: center; justify-content: center"><svg width="46" height="46" viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="64" rx="52" ry="32" fill="#FFFFFF"></ellipse><path d="M20 64c0-12 12-20 28-20 10 0 16 6 16 14 0 12-12 22-28 22-10 0-16-6-16-16z" fill="#F4EEE6"></path><path d="M54 50c14-6 34-4 42 6 6 8 2 20-12 24-12 4-26 2-32-6-4-6-4-20 2-24z" fill="#8F5A2A"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px"><h1 id="ftitle" style="margin: 0; font-size: 19px; font-weight: 700">料理を修正</h1><span style="font-size: 12px; color: #6E655D">AIの読み取り：カレーライス</span></span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="fname" style="font-size: 13px; font-weight: 500; color: #5C544C">料理名</label>
      <input id="fname" type="text" value="ハヤシライス" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 2px solid #B23F1B; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #2B2622">
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid #E5DACE; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #2B2622">ハヤシライス</button>
        <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid #E5DACE; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #2B2622">キーマカレー</button>
        <button style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1.5px solid #E5DACE; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #2B2622">ビーフシチュー</button>
      </div>
    </div>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0 0 8px; font-size: 13px; font-weight: 500; color: #5C544C">量</legend>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 4px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
        <label style="height: 42px; border-radius: 12px; font-size: 13px; display: flex; align-items: center; justify-content: center"><input type="radio" name="amt" style="position: absolute; opacity: 0; width: 1px; height: 1px">少なめ</label>
        <label style="height: 42px; border-radius: 12px; background: #2B2622; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center"><input type="radio" name="amt" checked style="position: absolute; opacity: 0; width: 1px; height: 1px">ふつう</label>
        <label style="height: 42px; border-radius: 12px; font-size: 13px; display: flex; align-items: center; justify-content: center"><input type="radio" name="amt" style="position: absolute; opacity: 0; width: 1px; height: 1px">多め</label>
        <label style="height: 42px; border-radius: 12px; font-size: 13px; display: flex; align-items: center; justify-content: center"><input type="radio" name="amt" style="position: absolute; opacity: 0; width: 1px; height: 1px">半分残した</label>
      </div>
    </fieldset>

    <div style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 13px; color: #5C544C">栄養の目安（再計算）</span>
      <span style="font-size: 14px; font-weight: 700">[kcal]</span>
    </div>

    <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #6E655D">この修正をAIの改善に使う設定は <b>オフ</b> です。<a href="Privacy.html">設定で変更</a></p>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Post.html" style="height: 50px; box-sizing: border-box; border-radius: 25px; border: 1.5px solid #E5DACE; background: #FFFFFF; color: #A3241A; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">この料理を削除</a>
      <a href="Post.html" style="height: 50px; border-radius: 25px; background: #B23F1B; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">保存</a>
    </div>
  </div>
</div>
</body>
</html>
