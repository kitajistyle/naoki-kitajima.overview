<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写真とデータの使い方</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23F1B}a:hover{color:#8E3014}
input.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:#CFC5BA;position:relative;margin:0;flex:none;cursor:pointer}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2)}
input.sw:checked{background:#2F7A4F}
input.sw:checked::after{left:23px}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #2B2622; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1 1 auto; overflow-y: auto; padding: 72px 20px 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #6E655D">はじめに · 1 / 3</span>
      <h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">写真とデータの使い方</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #6E655D">はじめる前に、大事なことだけまとめました。</p>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 6px 14px; display: flex; flex-direction: column">
      <div style="display: flex; gap: 12px; padding: 12px 0; align-items: flex-start">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #FCE6DC; color: #9A3615; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
        <span style="display: flex; flex-direction: column; gap: 3px"><b style="font-size: 14px">写真は料理の読み取りに使います</b><span style="font-size: 12.5px; line-height: 1.6; color: #6E655D">AIが料理名・量・栄養を推定します。顔や人物の分析はしません。</span></span>
      </div>
      <div style="display: flex; gap: 12px; padding: 12px 0; align-items: flex-start; border-top: 1px solid #F1EBE4">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #E3F1E8; color: #23603D; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 3px"><b style="font-size: 14px">栄養データは自分だけに表示</b><span style="font-size: 12.5px; line-height: 1.6; color: #6E655D">見せたいときだけ、設定から公開範囲を広げられます。</span></span>
      </div>
      <div style="display: flex; gap: 12px; padding: 12px 0; align-items: flex-start; border-top: 1px solid #F1EBE4">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #E3EEF5; color: #2F5873; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.500-7 12-7 12z"></path><path d="M4 4l16 16"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 3px"><b style="font-size: 14px">写真の位置情報は自動で消します</b><span style="font-size: 12.5px; line-height: 1.6; color: #6E655D">投稿前に撮影場所などの情報を取り除きます。</span></span>
      </div>
      <div style="display: flex; gap: 12px; padding: 12px 0; align-items: flex-start; border-top: 1px solid #F1EBE4">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #F1E3D3; color: #6B4A22; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c.8-3.500 3.200-5 6-5s5.200 1.500 6 5"></path><path d="M16 4.500a3.500 3.500 0 0 1 0 7M18 15c1.800.6 2.700 2.200 3 5"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 3px"><b style="font-size: 14px">投稿は友達（相互フォロー）まで</b><span style="font-size: 12.5px; line-height: 1.6; color: #6E655D">公開アカウントにするかは、あとで自分で選べます。</span></span>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #6E655D; font-weight: 500">任意</span>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px">
        <span style="display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto"><b style="font-size: 14px">修正内容をAIの改善に使う</b><span style="font-size: 12.5px; line-height: 1.6; color: #6E655D">料理名や量を直した内容を、読み取り精度の向上に使います。オフでもすべての機能が使えます。</span></span>
        <input class="sw" type="checkbox" role="switch">
      </label>
    </div>

    <a href="#policy" style="font-size: 13px; font-weight: 500; align-self: flex-start">プライバシーポリシーの全文を読む</a>
  </div>

  <div style="flex: none; padding: 12px 20px 36px">
    <a href="Permissions.html" style="height: 52px; border-radius: 26px; background: #B23F1B; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">同意して次へ</a>
  </div>
</div>
</body>
</html>
