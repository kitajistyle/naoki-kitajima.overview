<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>友達</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23F1B}a:hover{color:#8E3014}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #2B2622; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: none; padding: 56px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="Settings.html" aria-label="戻る" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2B2622"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 17px; font-weight: 700">友達</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 16px">
    <label style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 24px; background: #FFFFFF; border: 1.5px solid #E5DACE; display: flex; align-items: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E655D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">ユーザーIDで検索</span>
      <input type="search" placeholder="ユーザーIDで検索" style="flex: 1 1 auto; min-width: 0; height: 40px; border: none; background: transparent; font-family: inherit; font-size: 15px; color: #2B2622">
    </label>

    <button style="min-height: 64px; padding: 10px 14px; border-radius: 20px; border: none; background: #FCE6DC; font-family: inherit; color: #2B2622; display: flex; gap: 12px; align-items: center; text-align: left">
      <span style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 120 120" aria-hidden="true"><path d="M16 54h88c0 26-20 42-44 42S16 80 16 54z" fill="#D64545"></path><ellipse cx="60" cy="54" rx="44" ry="11" fill="#E9B872"></ellipse><circle cx="44" cy="52" r="8" fill="#C98A5A"></circle><circle cx="66" cy="52" r="6" fill="#FFFFFF"></circle><circle cx="66" cy="52" r="3" fill="#F2A71B"></circle></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto"><b style="font-size: 14px; color: #9A3615">招待リンクを送る</b><span style="font-size: 12px; color: #5C544C">LINEなどで友達を誘えます</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A3615" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"></path></svg>
    </button>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 0 6px; font-size: 13px; color: #5C544C; font-weight: 500">届いた申請 · [数]</h2>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 14px; display: flex; flex-direction: column">
        <div style="display: flex; gap: 12px; align-items: center; min-height: 64px">
          <div style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #DCE6F2; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">は</div>
          <span style="display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0"><b style="font-size: 14px">[名前]</b><span style="font-size: 12px; color: #6E655D">@[ユーザーID] · 共通の友達 [数]人</span></span>
          <button style="height: 36px; padding: 0 14px; flex: none; white-space: nowrap; border-radius: 18px; border: none; background: #B23F1B; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">承認</button>
          <button aria-label="申請を削除" style="flex: none; width: 36px; height: 36px; border-radius: 18px; border: 1.5px solid #E5DACE; background: #FFFFFF; color: #5C544C; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 0 6px; font-size: 13px; color: #5C544C; font-weight: 500">友達 · [数]</h2>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 14px; display: flex; flex-direction: column">
        <div style="display: flex; gap: 12px; align-items: center; min-height: 60px">
          <div style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #E6EDDD; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">ゆ</div>
          <span style="display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0"><b style="font-size: 14px">[名前]</b><span style="font-size: 12px; color: #6E655D">今日 3食そろった</span></span>
          <button aria-label="[名前]さんのメニュー" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #5C544C; font-size: 18px; letter-spacing: 1px; font-family: inherit">…</button>
        </div>
        <div style="display: flex; gap: 12px; align-items: center; min-height: 60px; border-top: 1px solid #F1EBE4">
          <div style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #FBEBD3; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">さ</div>
          <span style="display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0"><b style="font-size: 14px">[名前]</b><span style="font-size: 12px; color: #6E655D">ミュート中</span></span>
          <button aria-label="[名前]さんのメニュー" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #5C544C; font-size: 18px; letter-spacing: 1px; font-family: inherit">…</button>
        </div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; color: #6E655D">友達の … から選べる操作</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <span style="font-size: 13px; padding: 8px 12px; border-radius: 14px; background: #F6F1EB">ミュート</span>
        <span style="font-size: 13px; padding: 8px 12px; border-radius: 14px; background: #F6F1EB">友達をやめる</span>
        <a href="Report.html" style="font-size: 13px; padding: 8px 12px; border-radius: 14px; background: #F6F1EB; color: #A3241A; text-decoration: none">ブロック・通報</a>
      </div>
      <span style="font-size: 12px; line-height: 1.6; color: #6E655D">どの操作も相手には通知されません。</span>
    </div>
  </div>
</div>
</body>
</html>
