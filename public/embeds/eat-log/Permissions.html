<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アクセスの許可</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23F1B}a:hover{color:#8E3014}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #2B2622; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1 1 auto; padding: 72px 20px 16px; display: flex; flex-direction: column; gap: 20px">
    <span style="font-size: 13px; color: #6E655D">はじめに · 3 / 3</span>
    <div style="height: 170px; border-radius: 28px; background: #FCE6DC; position: relative; overflow: hidden; flex: none">
      <div style="position: absolute; left: 50%; top: 22px; margin-left: -70px; width: 140px; height: 120px; border-radius: 26px; background: #2B2622"></div>
      <div style="position: absolute; left: 50%; top: 34px; margin-left: -58px; width: 116px; height: 96px; border-radius: 18px; background: #F6DDD2; display: flex; align-items: center; justify-content: center">
        <svg width="86" height="86" viewBox="0 0 120 120" aria-hidden="true"><path d="M24 58c4-16 18-24 36-24s32 8 36 24z" fill="#FFFFFF"></path><path d="M40 47c6-8 20-10 30-6 4 2 4 6 0 8-10 4-22 4-30-2z" fill="#F08A65"></path><circle cx="78" cy="47" r="5" fill="#6BAA5C"></circle><path d="M18 58h84c0 24-18 40-42 40S18 82 18 58z" fill="#3E6E8E"></path><rect x="16" y="55" width="88" height="7" rx="3.5" fill="#2F5873"></rect></svg>
      </div>
      <div style="position: absolute; left: 50%; top: 14px; margin-left: 40px; width: 36px; height: 36px; border-radius: 18px; background: #B23F1B; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3"></circle></svg></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 26px; line-height: 1.35; font-weight: 700">アクセスの許可</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #6E655D">このあと端末の確認が出ます。使う理由は次のとおりです。</p>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 14px; display: flex; flex-direction: column">
      <div style="display: flex; gap: 12px; padding: 12px 0; align-items: center">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #FCE6DC; color: #9A3615; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto"><b style="font-size: 14px">カメラ</b><span style="font-size: 12.5px; color: #6E655D">ごはんを撮るため</span></span>
        <span style="font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #FCE6DC; color: #9A3615; font-weight: 700; flex: none; white-space: nowrap">必須</span>
      </div>
      <div style="display: flex; gap: 12px; padding: 12px 0; align-items: center; border-top: 1px solid #F1EBE4">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #E3EEF5; color: #2F5873; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M20 16l-5-5-9 9"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto"><b style="font-size: 14px">写真</b><span style="font-size: 12.5px; color: #6E655D">撮り忘れた写真を選ぶため。選んだ写真だけ読み取ります</span></span>
        <span style="font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #F1EBE4; color: #5C544C; font-weight: 700; flex: none; white-space: nowrap">任意</span>
      </div>
      <div style="display: flex; gap: 12px; padding: 12px 0; align-items: center; border-top: 1px solid #F1EBE4">
        <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #FBEBD3; color: #7A5212; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto"><b style="font-size: 14px">通知</b><span style="font-size: 12.5px; color: #6E655D">ごはんの時間と、友達のリアクションのお知らせ</span></span>
        <span style="font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #F1EBE4; color: #5C544C; font-weight: 700; flex: none; white-space: nowrap">任意</span>
      </div>
    </div>
    <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #6E655D">あとから端末の設定アプリでいつでも変更できます。</p>
  </div>

  <div style="flex: none; padding: 12px 20px 36px; display: flex; flex-direction: column; gap: 4px">
    <a href="Style.html" style="height: 52px; border-radius: 26px; background: #B23F1B; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">許可して次へ</a>
    <a href="Style.html" style="height: 44px; color: #5C544C; font-size: 14px; display: flex; align-items: center; justify-content: center; text-decoration: none">あとで</a>
  </div>
</div>
</body>
</html>
