<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プライバシー設定</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23F1B}a:hover{color:#8E3014}
input.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:#CFC5BA;position:relative;margin:0;flex:none;cursor:pointer}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2)}
input.sw:checked{background:#2F7A4F}
input.sw:checked::after{left:23px}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #2B2622; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: none; padding: 56px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="Settings.html" aria-label="戻る" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2B2622"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 17px; font-weight: 700">プライバシー</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 18px">
    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0 0 8px 6px; font-size: 13px; color: #5C544C; font-weight: 500">アカウントの公開範囲</legend>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 14px; display: flex; flex-direction: column">
        <label style="display: flex; gap: 12px; align-items: center; min-height: 60px">
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto"><b style="font-size: 14px">友達だけ</b><span style="font-size: 12px; color: #6E655D">相互フォローの人だけが投稿を見られます</span></span>
          <input type="radio" name="acct" checked style="width: 22px; height: 22px; margin: 0; accent-color: #B23F1B">
        </label>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 60px; border-top: 1px solid #F1EBE4">
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto"><b style="font-size: 14px">公開アカウント</b><span style="font-size: 12px; color: #6E655D">誰でも投稿を見て、フォローできます</span></span>
          <input type="radio" name="acct" style="width: 22px; height: 22px; margin: 0; accent-color: #B23F1B">
        </label>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0 0 8px 6px; font-size: 13px; color: #5C544C; font-weight: 500">栄養データを見られる人</legend>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
        <label style="height: 40px; border-radius: 12px; background: #B23F1B; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center"><input type="radio" name="nut" checked style="position: absolute; opacity: 0; width: 1px; height: 1px">自分だけ</label>
        <label style="height: 40px; border-radius: 12px; color: #2B2622; font-size: 13px; display: flex; align-items: center; justify-content: center"><input type="radio" name="nut" style="position: absolute; opacity: 0; width: 1px; height: 1px">友達</label>
        <label style="height: 40px; border-radius: 12px; color: #2B2622; font-size: 13px; display: flex; align-items: center; justify-content: center"><input type="radio" name="nut" style="position: absolute; opacity: 0; width: 1px; height: 1px">公開</label>
      </div>
      <p style="margin: 0 6px; font-size: 12px; line-height: 1.6; color: #6E655D">カロリーやPFCの数字のことです。「バランス◎」などの簡単な表示は投稿と同じ範囲に出ます。</p>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 0 6px; font-size: 13px; color: #5C544C; font-weight: 500">見つけてもらう方法</h2>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 14px; display: flex; flex-direction: column">
        <label style="display: flex; gap: 12px; align-items: center; min-height: 56px">
          <span style="font-size: 14px; flex: 1 1 auto">ユーザーIDで検索できる</span>
          <input class="sw" type="checkbox" role="switch" checked>
        </label>
        <label style="display: flex; gap: 12px; align-items: center; min-height: 56px; border-top: 1px solid #F1EBE4">
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto"><span style="font-size: 14px">連絡先から見つけてもらう</span><span style="font-size: 12px; color: #6E655D">電話番号を持っている人に表示</span></span>
          <input class="sw" type="checkbox" role="switch">
        </label>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 0 0 6px; font-size: 13px; color: #5C544C; font-weight: 500">いつも守られていること</h2>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 14px; display: flex; flex-direction: column">
        <div style="display: flex; gap: 12px; align-items: center; min-height: 52px">
          <span style="font-size: 14px; flex: 1 1 auto">写真の位置情報</span><span style="font-size: 13px; color: #23603D; font-weight: 700">常に削除</span>
        </div>
        <div style="display: flex; gap: 12px; align-items: center; min-height: 52px; border-top: 1px solid #F1EBE4">
          <span style="font-size: 14px; flex: 1 1 auto">リアクションの数</span><span style="font-size: 13px; color: #23603D; font-weight: 700">自分だけに表示</span>
        </div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 20px; padding: 0 14px; display: flex; flex-direction: column">
      <a href="Friends.html" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622"><span style="font-size: 14px; flex: 1 1 auto">ブロック中のユーザー</span><span style="font-size: 13px; color: #6E655D">[人数]</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
      <a href="Friends.html" style="display: flex; gap: 12px; align-items: center; min-height: 52px; text-decoration: none; color: #2B2622; border-top: 1px solid #F1EBE4"><span style="font-size: 14px; flex: 1 1 auto">ミュート中のユーザー</span><span style="font-size: 13px; color: #6E655D">[人数]</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8077" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></a>
      <label style="display: flex; gap: 12px; align-items: center; min-height: 64px; border-top: 1px solid #F1EBE4">
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto"><span style="font-size: 14px">修正内容をAIの改善に使う</span><span style="font-size: 12px; color: #6E655D">オフでもすべての機能が使えます</span></span>
        <input class="sw" type="checkbox" role="switch">
      </label>
    </div>
  </div>
</div>
</body>
</html>
