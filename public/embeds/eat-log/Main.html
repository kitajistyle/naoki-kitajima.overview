<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日のごはん</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23F1B}a:hover{color:#8E3014}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #2B2622; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1 1 auto; overflow-y: auto; padding: 56px 16px 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #6E655D">10月21日（水）</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 700">今日のごはん</h1>
      </div>
      <div style="display: flex; gap: 8px">
        <a href="Notifications.html" aria-label="お知らせ（未読あり）" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; color: #2B2622; display: flex; align-items: center; justify-content: center; position: relative">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
          <span style="position: absolute; right: 10px; top: 10px; width: 9px; height: 9px; border-radius: 5px; background: #B23F1B; border: 2px solid #FFFFFF"></span>
        </a>
        <a href="Settings.html" aria-label="マイページ" style="width: 44px; height: 44px; border-radius: 22px; background: #F1E3D3; color: #2B2622; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">な</a>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(43,38,34,0.06)">
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="width: 58px; height: 58px; border-radius: 29px; background: #FBEBD3; display: flex; align-items: center; justify-content: center; position: relative">
            <svg width="48" height="48" viewBox="0 0 120 120" role="img" aria-label="朝ごはん：トースト"><path d="M28 46c0-14 10-22 32-22s32 8 32 22c0 4-3 6-6 7v37H34V53c-3-1-6-3-6-7z" fill="#D9A15B"></path><path d="M34 48c0-10 8-16 26-16s26 6 26 16c0 3-2 4-4 5v31H38V53c-2-1-4-2-4-5z" fill="#F3D39A"></path><path d="M42 62c1-10 14-14 23-10 10 4 13 15 6 22-7 6-21 7-27 0-2-3-3-8-2-12z" fill="#FFFFFF"></path><circle cx="58" cy="64" r="8" fill="#F2A71B"></circle><circle cx="55" cy="61" r="2.5" fill="#FFE08A"></circle></svg>
            <div style="position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 11px; background: #2F7A4F; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
            </div>
          </div>
          <span style="font-size: 12px; font-weight: 500">朝</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="width: 58px; height: 58px; border-radius: 29px; background: #E3EEF5; display: flex; align-items: center; justify-content: center; position: relative">
            <svg width="48" height="48" viewBox="0 0 120 120" role="img" aria-label="昼ごはん：鮭丼"><path d="M24 58c4-16 18-24 36-24s32 8 36 24z" fill="#FFFFFF"></path><path d="M40 47c6-8 20-10 30-6 4 2 4 6 0 8-10 4-22 4-30-2z" fill="#F08A65"></path><path d="M50 42l4 6M60 41l3 7" stroke="#FFD2BF" stroke-width="2" stroke-linecap="round"></path><circle cx="78" cy="47" r="5" fill="#6BAA5C"></circle><circle cx="84" cy="52" r="4" fill="#4F8F45"></circle><path d="M18 58h84c0 24-18 40-42 40S18 82 18 58z" fill="#3E6E8E"></path><rect x="16" y="55" width="88" height="7" rx="3.5" fill="#2F5873"></rect><path d="M38 76h44" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"></path></svg>
            <div style="position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 11px; background: #2F7A4F; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
            </div>
          </div>
          <span style="font-size: 12px; font-weight: 500">昼</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <a href="Camera.html" aria-label="夜ごはんを撮る" style="width: 58px; height: 58px; box-sizing: border-box; border-radius: 29px; border: 2.5px solid #B23F1B; background: #FCE6DC; display: flex; align-items: center; justify-content: center; color: #B23F1B">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          </a>
          <span style="font-size: 12px; font-weight: 700; color: #B23F1B">夜</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="width: 58px; height: 58px; box-sizing: border-box; border-radius: 29px; border: 2px dashed #C9BCAE; display: flex; align-items: center; justify-content: center; position: relative">
            <svg width="44" height="44" viewBox="0 0 120 120" aria-hidden="true" style="opacity: 0.45"><ellipse cx="60" cy="92" rx="42" ry="11" fill="#EFE6DB"></ellipse><path d="M36 88c0-6 3-38 10-44h28c7 6 10 38 10 44z" fill="#F6CF6A"></path><path d="M44 46c0-7 7-11 16-11s16 4 16 11c0 4-7 6-16 6s-16-2-16-6z" fill="#8A4A1C"></path><circle cx="60" cy="30" r="6" fill="#D64545"></circle></svg>
            <div style="position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; border: 2px solid #C9BCAE; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #6E655D">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </div>
          </div>
          <span style="font-size: 12px; font-weight: 500">おやつ</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <div style="width: 58px; height: 58px; border-radius: 29px; background: #EEE8E1; display: flex; align-items: center; justify-content: center; position: relative">
            <svg width="42" height="42" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 24c9 0 42 52 42 64 0 9-8 10-42 10s-42-1-42-10c0-12 33-64 42-64z" fill="#DCD4CB"></path><rect x="44" y="70" width="32" height="28" rx="3" fill="#B3A99F"></rect></svg>
            <div style="position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 11px; background: #8A8077; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
            </div>
          </div>
          <span style="font-size: 12px; font-weight: 500; color: #6E655D">夜食</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; background: #FBF7F2; border-radius: 14px; padding: 10px 12px">
        <span style="font-size: 13px">あと1食で <b>夜食</b> が解放</span>
        <span style="font-size: 12px; color: #6E655D">夜ごはん 〜翌4:00</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">あなたの昼ごはん</h2>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 12px; display: flex; gap: 12px; align-items: center">
        <div style="width: 76px; height: 76px; flex: none; border-radius: 16px; background: #E3EEF5; display: flex; align-items: center; justify-content: center">
          <svg width="66" height="66" viewBox="0 0 120 120" role="img" aria-label="鮭丼"><path d="M24 58c4-16 18-24 36-24s32 8 36 24z" fill="#FFFFFF"></path><path d="M40 47c6-8 20-10 30-6 4 2 4 6 0 8-10 4-22 4-30-2z" fill="#F08A65"></path><path d="M50 42l4 6M60 41l3 7" stroke="#FFD2BF" stroke-width="2" stroke-linecap="round"></path><circle cx="78" cy="47" r="5" fill="#6BAA5C"></circle><circle cx="84" cy="52" r="4" fill="#4F8F45"></circle><path d="M18 58h84c0 24-18 40-42 40S18 82 18 58z" fill="#3E6E8E"></path><rect x="16" y="55" width="88" height="7" rx="3.5" fill="#2F5873"></rect><path d="M38 76h44" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <span style="font-size: 15px; font-weight: 500">[ひとこと]</span>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <span style="font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #E3F1E8; color: #23603D; font-weight: 700">バランス◎</span>
            <span style="font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #FCE6DC; color: #9A3615; font-weight: 700">手作り</span>
          </div>
          <span style="font-size: 12px; color: #6E655D">リアクション [数]（あなたにだけ表示）</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">友達のごはん</h2>

      <article style="background: #FFFFFF; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px">
          <div style="width: 36px; height: 36px; border-radius: 18px; background: #DCE6F2; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">は</div>
          <div style="display: flex; flex-direction: column">
            <span style="font-size: 14px; font-weight: 700">[友達の名前]</span>
            <span style="font-size: 12px; color: #6E655D">昼ごはん · 12:40</span>
          </div>
          <span style="margin-left: auto; font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #FCE6DC; color: #9A3615; font-weight: 700">手作り</span>
          <a href="Report.html" aria-label="この投稿のメニュー" style="width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: #5C544C; text-decoration: none; font-size: 18px; letter-spacing: 1px">…</a>
        </div>
        <div style="height: 240px; background: #F6DDD2; display: flex; align-items: center; justify-content: center">
          <svg width="210" height="210" viewBox="0 0 120 120" role="img" aria-label="ラーメン"><ellipse cx="60" cy="100" rx="40" ry="6" fill="#2B2622" opacity="0.08"></ellipse><path d="M16 54h88c0 26-20 42-44 42S16 80 16 54z" fill="#D64545"></path><path d="M30 74c8 4 16-4 24 0s16-4 24 0 12-2 14-2" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.5" fill="none" stroke-linecap="round"></path><ellipse cx="60" cy="54" rx="44" ry="11" fill="#E9B872"></ellipse><path d="M30 56c6-3 10 3 16 0s10 3 16 0 10 3 16 0" stroke="#F7DFA8" stroke-width="2.5" fill="none" stroke-linecap="round"></path><circle cx="42" cy="52" r="9" fill="#C98A5A"></circle><circle cx="42" cy="52" r="5" fill="#E8B48A"></circle><ellipse cx="64" cy="51" rx="8" ry="6" fill="#FFFFFF"></ellipse><circle cx="64" cy="51" r="3.5" fill="#F2A71B"></circle><rect x="76" y="36" width="12" height="18" rx="2" fill="#2E3B33" transform="rotate(12 82 45)"></rect><circle cx="54" cy="58" r="2.5" fill="#6BAA5C"></circle><circle cx="52" cy="46" r="2" fill="#6BAA5C"></circle><circle cx="74" cy="58" r="2" fill="#6BAA5C"></circle><path d="M70 14l28 42M80 12l24 40" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"></path></svg>
        </div>
        <div style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px">
          <p style="margin: 0; font-size: 14px; line-height: 1.6">[ひとこと]</p>
          <div style="display: flex; gap: 8px">
            <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid #E5DACE; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #2B2622">おいしそう</button>
            <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid #E5DACE; background: #FFFFFF; font-family: inherit; font-size: 13px; color: #2B2622">たべたい</button>
            <button style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid #B23F1B; background: #FCE6DC; font-family: inherit; font-size: 13px; color: #9A3615; font-weight: 700">真似したい</button>
          </div>
          <a href="Post.html" style="font-size: 13px; font-weight: 500">レシピを見る</a>
        </div>
      </article>

      <article style="background: #FFFFFF; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px">
          <div style="width: 36px; height: 36px; border-radius: 18px; background: #E6EDDD; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">ゆ</div>
          <div style="display: flex; flex-direction: column">
            <span style="font-size: 14px; font-weight: 700">[友達の名前]</span>
            <span style="font-size: 12px; color: #6E655D">おやつ · 15:10</span>
          </div>
        </div>
        <div style="height: 240px; background: #FBEBD3; display: flex; align-items: center; justify-content: center">
          <svg width="200" height="200" viewBox="0 0 120 120" role="img" aria-label="プリン"><ellipse cx="60" cy="92" rx="42" ry="11" fill="#FFFFFF"></ellipse><path d="M36 88c0-6 3-38 10-44h28c7 6 10 38 10 44z" fill="#F6CF6A"></path><path d="M44 46c0-7 7-11 16-11s16 4 16 11c0 4-7 6-16 6s-16-2-16-6z" fill="#8A4A1C"></path><rect x="50" y="48" width="4" height="10" rx="2" fill="#8A4A1C"></rect><rect x="66" y="48" width="4" height="13" rx="2" fill="#8A4A1C"></rect><path d="M44 70c4 2 8 2 12 0" stroke="#FBE3A0" stroke-width="2.5" fill="none" stroke-linecap="round"></path><circle cx="60" cy="30" r="6" fill="#D64545"></circle><circle cx="58" cy="28" r="1.6" fill="#F4A3A3"></circle><path d="M60 24c2-6 6-8 10-8" stroke="#4F8F45" stroke-width="2" fill="none" stroke-linecap="round"></path></svg>
        </div>
      </article>
    </div>
  </div>

  <nav style="flex: none; height: 84px; box-sizing: border-box; padding: 8px 12px 24px; background: #FFFFFF; border-top: 1px solid #EEE6DC; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <a href="Main.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #B23F1B; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>今日</a>
    <a href="Calendar.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #6E655D; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>カレンダー</a>
    <a href="Camera.html" aria-label="撮る" style="justify-self: center; width: 56px; height: 56px; border-radius: 28px; background: #B23F1B; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></a>
    <a href="Nutrition.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #6E655D; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-9"></path></svg>栄養</a>
    <a href="Settings.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #6E655D; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>マイページ</a>
  </nav>
</div>
