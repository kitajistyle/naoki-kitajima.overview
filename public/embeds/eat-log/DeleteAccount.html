<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アカウント削除</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23F1B}a:hover{color:#8E3014}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #2B2622; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: none; padding: 56px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="Settings.html" aria-label="戻る" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #2B2622"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 17px; font-weight: 700">アカウント削除</span>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
      <svg width="110" height="110" viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="96" rx="40" ry="8" fill="#EFE6DB"></ellipse><path d="M60 24c9 0 42 52 42 64 0 9-8 10-42 10s-42-1-42-10c0-12 33-64 42-64z" fill="#FFFFFF"></path><rect x="44" y="70" width="32" height="28" rx="3" fill="#2E3B33"></rect><circle cx="50" cy="56" r="2.5" fill="#2B2622"></circle><circle cx="70" cy="56" r="2.5" fill="#2B2622"></circle><path d="M54 66c4-3 8-3 12 0" stroke="#2B2622" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">本当に削除しますか？</h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #6E655D">次のデータがすべて消え、元に戻せません。</p>
    </div>

    <ul style="margin: 0; padding: 6px 16px; list-style: none; background: #FFFFFF; border-radius: 20px; display: flex; flex-direction: column">
      <li style="display: flex; gap: 10px; align-items: center; min-height: 46px; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B23F1B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>投稿した写真とひとこと</li>
      <li style="display: flex; gap: 10px; align-items: center; min-height: 46px; font-size: 14px; border-top: 1px solid #F1EBE4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B23F1B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>カレンダーと栄養の記録</li>
      <li style="display: flex; gap: 10px; align-items: center; min-height: 46px; font-size: 14px; border-top: 1px solid #F1EBE4"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B23F1B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>友達・リアクション・レシピ</li>
    </ul>

    <a href="#export" style="min-height: 56px; box-sizing: border-box; padding: 10px 14px; border-radius: 16px; border: 1.5px solid #E5DACE; background: #FFFFFF; color: #2B2622; text-decoration: none; display: flex; gap: 12px; align-items: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto"><b style="font-size: 14px">先にデータをダウンロード</b><span style="font-size: 12px; color: #6E655D">写真と記録をまとめて保存できます</span></span>
    </a>

    <p style="margin: 0; padding: 12px 14px; border-radius: 14px; background: #FBEBD3; font-size: 12.5px; line-height: 1.6; color: #5C3F0E">削除の申請から [猶予期間] 以内にログインすると、削除を取り消せます。</p>

    <label style="display: flex; gap: 10px; align-items: center; min-height: 44px">
      <input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #A3241A">
      <span style="font-size: 14px">上記を理解しました</span>
    </label>
  </div>

  <div style="flex: none; padding: 12px 20px 36px; display: flex; flex-direction: column; gap: 4px">
    <button style="height: 52px; border-radius: 26px; border: none; background: #A3241A; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">アカウントを削除する</button>
    <a href="Settings.html" style="height: 44px; color: #2B2622; font-size: 14px; display: flex; align-items: center; justify-content: center; text-decoration: none">やめておく</a>
  </div>
</div>
</body>
</html>
