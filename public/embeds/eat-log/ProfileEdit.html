<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロフィール編集</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B23F1B}a:hover{color:#8E3014}
</style>
<style>body{background:#E9E2D9;display:flex;justify-content:center;padding:24px 0}body>div{border-radius:40px;box-shadow:0 8px 30px rgba(43,38,34,.15)}@media (max-width:420px){body{padding:0;background:#FBF7F2}body>div{border-radius:0;box-shadow:none}}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF7F2; color: #2B2622; font-family: 'Zen Maru Gothic', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: none; padding: 56px 16px 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="Settings.html" style="min-width: 64px; height: 44px; display: flex; align-items: center; color: #2B2622; font-size: 15px; text-decoration: none">キャンセル</a>
    <span style="font-size: 17px; font-weight: 700">プロフィール</span>
    <a href="Settings.html" style="min-width: 64px; height: 44px; display: flex; align-items: center; justify-content: flex-end; font-size: 15px; font-weight: 700; text-decoration: none">保存</a>
  </div>

  <div style="flex: 1 1 auto; overflow-y: auto; padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div style="width: 104px; height: 104px; border-radius: 52px; background: #FBEBD3; display: flex; align-items: center; justify-content: center; position: relative">
        <svg width="78" height="78" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 24c9 0 42 52 42 64 0 9-8 10-42 10s-42-1-42-10c0-12 33-64 42-64z" fill="#FFFFFF"></path><rect x="44" y="70" width="32" height="28" rx="3" fill="#2E3B33"></rect></svg>
        <button aria-label="アイコンを変更" style="position: absolute; right: -2px; bottom: -2px; width: 36px; height: 36px; border-radius: 18px; border: 3px solid #FBF7F2; background: #B23F1B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3"></circle></svg></button>
      </div>
      <span style="font-size: 12px; color: #6E655D">写真か、ごはんのイラストから選べます</span>
      <div style="display: flex; gap: 8px">
        <span style="width: 44px; height: 44px; border-radius: 22px; background: #FBEBD3; border: 2.5px solid #B23F1B; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true"><path d="M60 24c9 0 42 52 42 64 0 9-8 10-42 10s-42-1-42-10c0-12 33-64 42-64z" fill="#FFFFFF"></path><rect x="44" y="70" width="32" height="28" rx="3" fill="#2E3B33"></rect></svg></span>
        <span style="width: 44px; height: 44px; border-radius: 22px; background: #F6DDD2; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="92" rx="42" ry="11" fill="#FFFFFF"></ellipse><path d="M36 88c0-6 3-38 10-44h28c7 6 10 38 10 44z" fill="#F6CF6A"></path><path d="M44 46c0-7 7-11 16-11s16 4 16 11c0 4-7 6-16 6s-16-2-16-6z" fill="#8A4A1C"></path></svg></span>
        <span style="width: 44px; height: 44px; border-radius: 22px; background: #E3EEF5; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 120 120" aria-hidden="true"><path d="M24 58c4-16 18-24 36-24s32 8 36 24z" fill="#FFFFFF"></path><path d="M40 47c6-8 20-10 30-6 4 2 4 6 0 8-10 4-22 4-30-2z" fill="#F08A65"></path><path d="M18 58h84c0 24-18 40-42 40S18 82 18 58z" fill="#3E6E8E"></path></svg></span>
        <span style="width: 44px; height: 44px; border-radius: 22px; background: #E6EDDD; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 120 120" aria-hidden="true"><circle cx="40" cy="56" r="14" fill="#7DBB5E"></circle><circle cx="60" cy="48" r="16" fill="#5E9E48"></circle><circle cx="80" cy="56" r="13" fill="#8CC66A"></circle><circle cx="50" cy="52" r="6" fill="#E8613C"></circle><path d="M20 60h80c0 22-18 36-40 36S20 82 20 60z" fill="#FFFFFF"></path></svg></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pname" style="font-size: 13px; font-weight: 500; color: #5C544C">名前</label>
      <input id="pname" type="text" value="[名前]" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1.5px solid #E5DACE; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #2B2622">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pid" style="font-size: 13px; font-weight: 500; color: #5C544C">ユーザーID</label>
      <div style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1.5px solid #2F7A4F; background: #FFFFFF; display: flex; align-items: center; gap: 4px">
        <span style="font-size: 15px; color: #6E655D">@</span>
        <input id="pid" type="text" value="[ユーザーID]" style="flex: 1 1 auto; min-width: 0; height: 44px; border: none; background: transparent; font-family: inherit; font-size: 15px; color: #2B2622; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F7A4F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
      </div>
      <span style="font-size: 12px; color: #23603D">使えるIDです · 英数字と _ のみ</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pbio" style="font-size: 13px; font-weight: 500; color: #5C544C">ひとこと</label>
      <textarea id="pbio" rows="3" placeholder="好きな食べ物や、最近ハマっているごはん" style="box-sizing: border-box; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #E5DACE; background: #FFFFFF; font-family: inherit; font-size: 15px; line-height: 1.6; color: #2B2622; resize: none"></textarea>
      <span style="font-size: 12px; color: #6E655D; align-self: flex-end">0 / [上限]</span>
    </div>

    <p style="margin: 0; padding: 12px 14px; border-radius: 14px; background: #FFFFFF; font-size: 12.5px; line-height: 1.6; color: #6E655D">名前・ユーザーID・アイコン・ひとことは、非公開アカウントでも検索結果や友達申請で表示されます。</p>
  </div>
</div>
</body>
</html>
